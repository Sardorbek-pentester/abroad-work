{% extends 'base.html' %}

{% block title %}Yangi parol o'rnating{% endblock %}

{% block content %}
<section class="page-shell py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="form-card shadow-glass fade-in-up">
                    <div class="text-center mb-4">
                        <h3 class="fw-bold text-gradient">Yangi parol o'rnating</h3>
                        <p class="text-muted">Iltimos, yangi parolingizni kiriting.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}

                        {% for field in form %}
                            <div class="mb-4">
                                <label class="form-label fw-semibold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">{{ field.errors }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill">Parolni saqlash</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
