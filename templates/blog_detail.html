{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="page-shell py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                    {% if post.image %}
                        <img src="{{ post.image.url }}" class="img-fluid" alt="{{ post.title }}" style="max-height: 450px; object-fit: cover;">
                    {% endif %}

                    <div class="p-4 p-md-5">
                        <p class="text-muted mb-2">{{ post.created_at|date:"d.m.Y H:i" }}</p>
                        <h1 class="fw-bold mb-4">{{ post.title }}</h1>

                        <div class="fs-5 text-dark" style="line-height: 1.8;">
                            {{ post.content|linebreaks }}
                        </div>

                        <div class="mt-4">
                            <a href="{% url 'blog' %}" class="btn btn-outline-primary rounded-pill">
                                ← Blogga qaytish
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
