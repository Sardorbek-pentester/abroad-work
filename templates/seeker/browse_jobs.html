{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title">Browse Jobs</h2>
                    <div class="row row-cols-1 row-cols-md-2 g-4 mt-3">
                        {% for job in jobs %}
                            <div class="col">
                                <div class="card h-100">
                                    <div class="card-body d-flex flex-column">
                                        <h5 class="card-title">{{ job.title }}</h5>
                                        <p class="card-text mb-1"><strong>Location:</strong> {{ job.city }}, {{ job.country }}</p>
                                        <p class="card-text mb-1"><strong>Experience:</strong> {{ job.experience }}</p>
                                        <p class="card-text mb-3"><strong>Salary:</strong> {{ job.salary }}</p>
                                        <a href="{% url 'seeker_apply_job' job.id %}" class="btn btn-primary mt-auto">Apply</a>
                                    </div>
                                </div>
                            </div>
                        {% empty %}
                            <div class="col">
                                <div class="alert alert-secondary">No jobs available.</div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
